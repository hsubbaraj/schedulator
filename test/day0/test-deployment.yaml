apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-llm
  namespace: default
  labels:
    app: test-llm
    model: llama-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-llm
  template:
    metadata:
      labels:
        app: test-llm
        model: llama-test
    spec:
      containers:
      - name: model
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            nvidia.com/gpu: "4"
            memory: 80Gi
            cpu: "16"
          limits:
            nvidia.com/gpu: "4"
            memory: 80Gi
            cpu: "16"
      nodeSelector:
        gpu-type: H100
