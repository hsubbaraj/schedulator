apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-gpu-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-gpu
  template:
    metadata:
      labels:
        app: test-gpu
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          limits:
            nvidia.com/gpu: "4"
          requests:
            nvidia.com/gpu: "4"
