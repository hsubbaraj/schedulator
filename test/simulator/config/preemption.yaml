name: "Preemption"
duration: "2m"
tick_interval: "1s"
closed_loop: true
topology:
  clusters:
    - id: "preemption-cluster"
      nodes: 2
      gpus_per_node: 8
apps:
  - id: "low-pri"
    priority: 2
    gpus_per_replica: 4
    min_replicas: 1
    sla_ttft: "500ms"
    cold_start: "5s"
    throughput_per_replica: 5.0
    profile: "test/fixtures/profiles/llama2-7b.json"
  - id: "high-pri"
    priority: 0
    gpus_per_replica: 4
    min_replicas: 0
    sla_ttft: "200ms"
    cold_start: "5s"
    throughput_per_replica: 5.0
    profile: "test/fixtures/profiles/llama2-70b.json"
workload: "test/simulator/traces/preemption.csv"
