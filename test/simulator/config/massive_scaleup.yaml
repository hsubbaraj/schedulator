name: "Massive Scale Up"
duration: "2m"
tick_interval: "1s"
closed_loop: true
topology:
  clusters:
    - id: "cluster-1"
      nodes: 100
      gpus_per_node: 8
apps:
  - id: "model-a"
    priority: 1
    gpus_per_replica: 1
    sla_ttft: "200ms"
    cold_start: "2s"
    throughput_per_replica: 5.0
    max_queue_depth: 1000.0
    profile: "test/fixtures/profiles/llama2-70b.json"
workload: "test/simulator/traces/massive_scaleup.csv"
